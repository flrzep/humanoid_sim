<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>G1 Boxing</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2230; --line:#2b3647; --fg:#e6edf3; --muted:#8b98a9;
          --accent:#4ea1ff; --p1:#4ea1ff; --p2:#f0883e; --good:#3fb950; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  header { padding:12px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:16px; }
  header h1 { margin:0; font-size:18px; font-weight:700; letter-spacing:.04em; }
  .score { margin-left:auto; display:flex; gap:18px; align-items:center; font-weight:700; }
  .score .p1 { color:var(--p1); } .score .p2 { color:var(--p2); }
  .wrap { padding:18px; max-width:1100px; margin:0 auto; }
  .stage { position:relative; }
  .view { width:100%; aspect-ratio:16/9; max-height:78vh; display:block;
          border:1px solid var(--line); border-radius:10px; background:#000; }
  #canvas { width:100%; height:100%; display:block; border-radius:10px; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; gap:14px;
             align-items:center; justify-content:center; border-radius:10px;
             background:rgba(10,14,20,.78); text-align:center; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:42px; font-weight:800; letter-spacing:.02em; }
  .overlay button { background:var(--accent); color:#05101f; border:none; border-radius:8px;
                    padding:12px 22px; font-size:16px; font-weight:700; cursor:pointer; }
  .pads { display:flex; gap:14px; margin-top:14px; flex-wrap:wrap; }
  .pad { flex:1 1 320px; background:var(--panel); border:1px solid var(--line);
         border-radius:8px; padding:12px 14px; }
  .pad h3 { margin:0 0 8px; font-size:13px; }
  .pad.p1 h3 { color:var(--p1); } .pad.p2 h3 { color:var(--p2); }
  .pad .conn { font-size:11px; color:var(--muted); font-weight:600; }
  .keys { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12px; color:var(--muted); }
  .keys kbd { background:#243044; border:1px solid var(--line); border-radius:4px; padding:1px 6px;
              font:inherit; font-size:11px; color:var(--fg); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mujoco-js": "https://cdn.jsdelivr.net/npm/mujoco-js@0.0.7/dist/mujoco_wasm.js"
}}
</script>
</head>
<body>
<header>
  <h1>🥊 G1 BOXING</h1>
  <div class="score">
    <span class="p1">P1 <span id="w1">0</span></span>
    <span id="round" class="tag">Round 1</span>
    <span class="p2"><span id="w2">0</span> P2</span>
  </div>
</header>

<div class="wrap">
  <div class="stage">
    <div class="view"><canvas id="canvas"></canvas></div>
    <div id="overlay" class="overlay"><div id="ovmsg">Loading…</div></div>
    <div id="ko" class="overlay hidden">
      <div class="big" id="kotext">KO</div>
      <button id="restart">Rematch (Enter)</button>
    </div>
  </div>

  <div class="pads">
    <div class="pad p1">
      <h3>Player 1 <span class="conn" id="c1">— keyboard</span></h3>
      <div class="keys">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>move / turn</span>
        <span><kbd>Q</kbd><kbd>E</kbd></span><span>strafe</span>
        <span><kbd>F</kbd> / <kbd>G</kbd></span><span>punch left / right</span>
        <span>gamepad</span><span>left stick move · L1/R1 punch</span>
      </div>
    </div>
    <div class="pad p2">
      <h3>Player 2 <span class="conn" id="c2">— gamepad needed</span></h3>
      <div class="keys">
        <span><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span><span>move / turn</span>
        <span><kbd>,</kbd> / <kbd>.</kbd></span><span>strafe</span>
        <span><kbd>K</kbd> / <kbd>L</kbd></span><span>punch left / right</span>
        <span>gamepad 2</span><span>left stick move · L1/R1 punch</span>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/boxing_app.js"></script>
</body>
</html>
